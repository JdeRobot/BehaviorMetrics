            Model: "/home/daniel/code/2025-phd-daniel-guerrero/scripts/model_training/pilotnet_balanced_weights.pth"
            ImageCropped: True
            ImageSize: [200, 66]
            TopRatio: 0.40 
            ImageNormalized: True
            PredictionsNormalized: True
            GPU: True
            UseOptimized: False
            ImageTransform: ''
            
            # --- SECCIÓN CORREGIDA ---
            # Nuevo, calcular metricas
            # TargetPoint: [193.75, 118.40]  <-- Comentado para evitar el río
            TargetRadius: 0.5
            RouteSamplingResolution: 2.0
            UseTargetRoute: false
            # IdealRouteCSV: ./perfect_routes/town02_ruta_ideal.csv
            
            # Debe coincidir con Behaviors.Robot.InitPosition
            SpawnPoint: [225.25, -364.11, 0.28, 0.0, -0.30, 0.0]
            
            IdealMaxProjDist: 1.0
            # para inferencia
            SimHz: 20.0
            PolicyHz: 20.0
            ThrottleMode: CLIP
            FixedThrottle: 0.35
            ThrottleMin: 0.18
            ThrottleMax: 0.70

            UseSteerClip: True
            SteerClipMin: -0.95
            SteerClipMax: 0.95  # noise 0.6

        Type: 'CARLA'
    Simulation:
        # World: configs/CARLA/default_carla_api_script.yml
        World: configs/CARLA/eval_pilotnet.yml
        Map: 'Town04_Opt'
        RandomSpawnPoint: False
    Experiment:
        Name: "Carla Town02 Test Suite"
        Description: "Testing model in Town02 with each route consisting of two turns."
        UseWorldTimeouts: 
        Timeout: [60] # for each world!
        Repetitions: 15 # 15 número de ejecuciones
    Dataset:
        In: '/tmp/my_bag'
        Out: ''
    Stats:
        Out: './'
        PerfectLap: './perfect_bags/lap-simple-circuit/'
        
    Layout:
        Frame_0:
            Name: frame_0
            Geometry: [1, 1, 1, 1]
            Data: rgbimage
        Frame_1:
