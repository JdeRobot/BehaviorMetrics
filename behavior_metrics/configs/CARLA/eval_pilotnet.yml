Behaviors:
    Robot:
        Name: 'ego_vehicle'
        Model: 'tesla.model3'
        Sensors:
            Cameras:
                Camera_0:
                    Name: 'camera_0'
                    Type: 'rgb'
                    Topic: 'Front'
                    Position: '2.0 0 1.4 0 0 0'
                    Width: 800
                    Height: 600
                    FOV: 90
                    SensorTick: 0.05
                Camera_2:
                    Name: 'camera_1'
                    Type: 'depth'
                    Topic: 'Depth'
                    Position: '2.0 0 2.0 0 0 0'
                    SensorTick: 0.05
                Camera_1:
                    Name: 'camera_2'
                    Type: 'semantic_segmentation'
                    Topic: 'Seg'
                    Position: '1.3 0 1.5 0 0 0'
                    SensorTick: 0.05
            Pose3D:
                Pose3D_0:
                    Name: 'pose3d_0'
                    Topic: '/carla/ego_vehicle/odometry'
            BirdEyeView:
                BirdEyeView_0:
                    Name: 'bird_eye_view_0'
                    Topic: ''
        Actuators:
            CARLA_Motors:
                Motors_0:
                    Name: 'motors_0'
                    Topic: ''
                    MaxV: 15
                    MaxW: 0.5

        # Fixed spawn point on Town04 highway
        InitPosition: '225.25 -364.11 0.28 0.00 -0.30 0.00'

        # =========================================================================
        # 15 evaluation cases: same target point, different pose and orientation
        # =========================================================================
        # HARD LEFT (-1.8m)
        # Case 1: InitPosition: '195.20 125.00 0.50 0.00 75.0 0.00'
        # Case 2: InitPosition: '195.20 125.00 0.50 0.00 90.0 0.00'
        # Case 3: InitPosition: '195.20 125.00 0.50 0.00 105.0 0.00'

        # SOFT LEFT (-0.9m)
        # Case 4: InitPosition: '192.4 125.00 0.50 0.00 75.0 0.00'
        # Case 5: InitPosition: '192.40 125.00 0.50 0.00 90.0 0.00'
        # Case 6: InitPosition: '192.40 125.00 0.50 0.00 105.0 0.00'

        # CENTERED
        # Case 7: InitPosition: '191.00 125.00 0.50 0.00 75.0 0.00'
        # Case 8: InitPosition: '191.00 125.00 0.50 0.00 90.0 0.00'
        # Case 9: InitPosition: '191.00 125.00 0.50 0.00 105.0 0.00'

        # SOFT RIGHT (+0.9m)
        # Case 10: InitPosition: '190.00 125.00 0.50 0.00 75.0 0.00'
        # Case 11: InitPosition: '190.00 125.00 0.50 0.00 90.0 0.00'
        # Case 12: InitPosition: '190.00 125.00 0.50 0.00 105.0 0.00'

        # HARD RIGHT (+1.8m)
        # Case 13: InitPosition: '189.00 125.00 0.50 0.00 75.0 0.00'
        # Case 14: InitPosition: '189.00 125.00 0.50 0.00 90.0 0.00'
        # Case 15: InitPosition: '189.00 131.00 0.50 0.00 105.0 0.00'

        BrainPath: '/home/daniel/code/BehaviorMetrics/behavior_metrics/brains/CARLA/brain_pilotnet_rgb.py'

        PilotTimeCycle: 50 # Control period in ms
        AsyncMode: False   # Set to False for synchronous simulator stepping
        Parameters:
            Model: "/home/daniel/code/2025-phd-daniel-guerrero/scripts/model_training/pilotnet_balanced_weights.pth"
            ImageCropped: True
            ImageSize: [200, 66]
            TopRatio: 0.40
            ImageNormalized: True
            PredictionsNormalized: True
            GPU: True
            UseOptimized: False
            ImageTransform: ''

            TargetRadius: 0.5
            RouteSamplingResolution: 2.0
            UseTargetRoute: false

            # Must match Behaviors.Robot.InitPosition
            SpawnPoint: [225.25, -364.11, 0.28, 0.0, -0.30, 0.0]

            IdealMaxProjDist: 1.0
            SimHz: 20.0
            PolicyHz: 20.0
            ThrottleMode: CLIP
            FixedThrottle: 0.35
            ThrottleMin: 0.18
            ThrottleMax: 0.70

            UseSteerClip: True
            SteerClipMin: -0.95
            SteerClipMax: 0.95

        Type: 'CARLA'
    Simulation:
        World: configs/CARLA/eval_pilotnet.yml
        Map: 'Town04_Opt'
        RandomSpawnPoint: False
    Experiment:
        Name: "Carla Town02 Test Suite"
        Description: "Testing model in Town02 with each route consisting of two turns."
        UseWorldTimeouts:
        Timeout: [60] # Timeout in seconds per world
        Repetitions: 15
    Dataset:
        In: '/tmp/my_bag'
        Out: ''
    Stats:
        Out: './'
        PerfectLap: './perfect_bags/lap-simple-circuit/'

    Layout:
        Frame_0:
            Name: frame_0
            Geometry: [1, 1, 1, 1]
            Data: rgbimage
        Frame_1:
            Name: frame_1
            Geometry: [0, 1, 1, 1]
            Data: rgbimage
        Frame_2:
            Name: frame_2
            Geometry: [0, 2, 1, 1]
            Data: rgbimage
        Frame_3:
            Name: frame_3
            Geometry: [1, 2, 1, 1]
            Data: rgbimage
